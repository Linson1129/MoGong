[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mogong-backend"
version = "0.1.0"
description = "MoGong backend: layout persistence and the document-to-layout compile engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # `(str, Enum)` is the form Pydantic's own documentation uses, and it keeps `str(member)`
    # returning "ClassName.MEMBER". That difference never reaches the wire, because Pydantic
    # serializes by `.value` either way, so switching to StrEnum would be churn that buys nothing
    # and asks a reader to re-check every bare str() call in the codebase.
    "UP042",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    # Test data deliberately contains Chinese prose, because that is what users will type into the
    # note field. The confusable-character check is aimed at Latin text that hides lookalikes, and
    # it misfires on legitimate CJK punctuation.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
